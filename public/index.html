<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漫游 · Thoughts Memo 译文与问答推荐流</title>
<meta name="description" content="基于 Thoughts Memo 译文索引（2,187 篇译文 + 1,393 篇知乎回答）构建的本地优先个性化推荐阅读器。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151714" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch{}</script>
<link rel="stylesheet" href="style.css">
</head>
<body id="top">
<a class="skip" href="#main" style="position:absolute;top:-80px;left:15px;background:var(--paper);padding:10px;z-index:30">跳至正文</a>
<div class="progress" id="scroll-progress" aria-hidden="true"></div>
<div class="shell">
  <header class="site-header">
    <a class="brand" href="#/" id="brand-link">
      <img src="avatar.webp" alt="" width="24" height="24">
      <span>雨夹雪 · 译文漫游</span>
      <span class="brand-sub">TM-Feed</span>
    </a>
    <nav aria-label="主导航" id="main-nav">
      <a href="#/" data-nav="feed" aria-current="page">推荐流</a>
      <a href="#/hot" data-nav="hot">高赞榜</a>
      <a href="#/topics" data-nav="topics">专栏与标签</a>
      <a href="#/saved" data-nav="saved">收藏与画像<span class="nav-badge" id="saved-count" hidden>0</span></a>
      <a href="#/search" data-nav="search">搜索</a>
      <button class="theme" type="button" id="theme-toggle" aria-label="切换深浅色主题" title="切换深浅色主题">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/>
        </svg>
      </button>
    </nav>
  </header>

  <main id="main">
    <p class="empty" id="boot-loading">正在加载 3,580 篇译文与回答索引及本地推荐向量…</p>

  <footer class="site-footer">

    <nav aria-label="相关链接">
      <a href="https://mizore.blog" target="_blank" rel="noopener">mizore.blog</a>
      <a href="https://github.com/mizorewww/tm-feed" target="_blank" rel="noopener">GitHub</a>
      <a href="https://l-m-sherlock.github.io/tm-index/" target="_blank" rel="noopener">原版索引</a>
    </nav>
  </footer>
</div>

<button class="to-top" id="to-top-btn" type="button" aria-label="回到顶部">↑</button>
<script src="app.js" defer></script>
</body>
